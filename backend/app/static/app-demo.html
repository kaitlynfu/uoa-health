<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Compass — Integrated MVP</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#102044;background:#eaf0f8}*{box-sizing:border-box}body{margin:0}.phone{max-width:480px;min-height:100vh;margin:auto;background:#f8faff;box-shadow:0 0 45px #0a265025}.top{position:sticky;top:0;z-index:4;padding:18px 20px 16px;color:#fff;background:linear-gradient(135deg,#071d49,#174b95)}.brand{display:flex;align-items:center;justify-content:space-between}.brand h1{margin:0;font-size:21px}.avatar{width:38px;height:38px;border:1px solid #ffffff55;border-radius:50%;color:#fff;background:#ffffff18;font-weight:800;cursor:pointer}.hero{margin-top:18px}.hero h2{margin:0 0 4px;font-size:26px}.hero p{margin:0;opacity:.78}.content{padding:18px 18px 90px}.card{margin-bottom:13px;padding:16px;border:1px solid #d9e2ef;border-radius:15px;background:#fff;box-shadow:0 4px 14px #1234630a}.card h3,.card h2{margin:0 0 7px}.muted{color:#64738e}.small{font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.feature{min-height:135px;cursor:pointer}.feature .icon{font-size:25px}.feature h3{margin-top:18px}.pill{display:inline-block;padding:5px 9px;border-radius:18px;color:#164488;background:#e8f1ff;font-size:12px;font-weight:700}.progress{height:9px;overflow:hidden;border-radius:7px;background:#dfe6f0}.progress span{display:block;height:100%;background:#1b5ab4}.btn{padding:11px 14px;border:1px solid #cbd7e7;border-radius:10px;background:#fff;color:#173b75;font:inherit;font-weight:750;cursor:pointer}.primary{border-color:#174b95;color:#fff;background:#174b95}.wide{width:100%}.field{display:grid;gap:6px;margin-bottom:13px;font-weight:700}.field input,.field select,.search{width:100%;padding:12px;border:1px solid #cbd7e7;border-radius:10px;background:#fff;font:inherit}.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 10px;border-radius:18px;background:#eaf2ff;color:#174b95;font-size:13px}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tabs button{white-space:nowrap}.tabs .active{color:#fff;background:#174b95}.bottom{position:fixed;z-index:5;bottom:0;left:50%;transform:translateX(-50%);display:grid;grid-template-columns:repeat(4,1fr);width:min(480px,100%);padding:9px 8px 8px;border-top:1px solid #d6e0ed;background:#fff}.nav{border:0;background:none;color:#73809a;font-size:11px;cursor:pointer}.nav b{display:block;margin-bottom:3px;font-size:20px}.nav.active{color:#174b95;font-weight:800}.hidden{display:none!important}.auth{padding:45px 26px}.auth-logo{width:62px;height:62px;display:grid;place-items:center;margin-bottom:25px;border-radius:18px;color:#fff;background:#174b95;font-size:29px}.auth h1{font-size:31px;margin:0 0 7px}.auth form{margin-top:28px}.divider{text-align:center;margin:18px;color:#7a879c}.message{min-height:22px;margin:12px 0;color:#a12626}.success{color:#237343}.result{cursor:pointer}.result p{margin:5px 0}.milestone{display:grid;grid-template-columns:auto 1fr;gap:11px}.milestone input{width:20px;height:20px}.notice{padding:13px;border-radius:11px;background:#fff4d7;color:#725111}.loading{text-align:center;padding:40px;color:#64738e}@media(min-width:481px){body{padding:22px}.phone{min-height:calc(100vh - 44px);border-radius:24px;overflow:hidden}.bottom{bottom:22px;border-radius:0 0 24px 24px}}
  </style>
</head>
<body><div class="phone">
  <section id="auth" class="auth">
    <div class="auth-logo">🎓</div><h1>Student Compass</h1><p class="muted">Your degree, career and campus — all in one place.</p>
    <div class="tabs" style="margin-top:28px"><button id="reg-tab" class="btn primary">Create account</button><button id="login-tab" class="btn">Log in</button></div>
    <form id="reg-form"><label class="field">Name<input name="display_name" required></label><label class="field">Email<input name="email" type="email" required></label><label class="field">Password<input name="password" type="password" minlength="10" required></label><button class="btn primary wide">Create my account</button></form>
    <form id="login-form" class="hidden"><label class="field">Email<input name="email" type="email" required></label><label class="field">Password<input name="password" type="password" required></label><button class="btn primary wide">Log in</button></form><div id="auth-message" class="message"></div>
  </section>
  <section id="onboarding" class="auth hidden"><div class="pill">STEP 1 OF 1</div><h1 style="margin-top:14px">Make it yours</h1><p class="muted">This helps us personalise programmes and your student journey. You can change it later.</p><form id="onboard-form"><label class="field">Programme<select id="onboard-programme"></select></label><label class="field">Current stage<select id="onboard-stage"><option value="1">Stage 1</option><option value="2">Stage 2</option><option value="3">Stage 3</option></select></label><label class="field">Interests<input id="onboard-interests" placeholder="Health, science, technology"></label><label class="field">Career goals<input id="onboard-careers" placeholder="Medicine, research, policy"></label><button class="btn primary wide">Open my dashboard</button></form><div id="onboard-message" class="message"></div></section>
  <section id="app" class="hidden"><header class="top"><div class="brand"><h1>Student Compass</h1><button id="avatar" class="avatar">A</button></div><div id="hero" class="hero"></div></header><main id="content" class="content"></main><nav class="bottom"><button class="nav active" data-view="home"><b>⌂</b>Home</button><button class="nav" data-view="explore"><b>⌕</b>Explore</button><button class="nav" data-view="journey"><b>✓</b>Journey</button><button class="nav" data-view="wayfinder"><b>➤</b>Wayfinder</button></nav></section>
</div>
<script>
const state={token:sessionStorage.getItem('journey_demo_token'),profile:null,programmes:[],careers:[],journey:null,view:'home',explore:'programmes'};const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(state.token)headers.Authorization=`Bearer ${state.token}`;const r=await fetch(path,{...options,headers});const data=r.status===204?null:await r.json();if(!r.ok)throw new Error(data?.detail||`Request failed (${r.status})`);return data}
function terms(value){return value.split(',').map(x=>x.trim()).filter(Boolean)}function message(id,text,ok=false){$(id).textContent=text;$(id).className=`message ${ok?'success':''}`}
function authMode(mode){$('reg-form').classList.toggle('hidden',mode!=='register');$('login-form').classList.toggle('hidden',mode==='register');$('reg-tab').classList.toggle('primary',mode==='register');$('login-tab').classList.toggle('primary',mode==='login')}
async function authenticate(path,form){try{const data=await api(path,{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(form)))});state.token=data.access_token;sessionStorage.setItem('journey_demo_token',state.token);await bootstrap(true)}catch(e){message('auth-message',e.message)}}
async function bootstrap(newAccount=false){try{[state.programmes,state.careers,state.profile]=await Promise.all([api('/programmes?limit=200'),api('/careers?limit=200'),api('/profile/me')]);$('auth').classList.add('hidden');if(newAccount||(!state.profile.programme&&!state.profile.interests.length)){renderOnboarding()}else{openApp()}}catch(e){state.token=null;sessionStorage.removeItem('journey_demo_token');$('auth').classList.remove('hidden');message('auth-message',e.message)}}
function renderOnboarding(){$('onboarding').classList.remove('hidden');$('onboard-programme').innerHTML='<option value="">I’m still deciding</option>'+state.programmes.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}
$('onboard-form').onsubmit=async e=>{e.preventDefault();try{state.profile=await api('/profile/me',{method:'PATCH',body:JSON.stringify({programme_id:Number($('onboard-programme').value)||null,current_stage:Number($('onboard-stage').value),catalogue_year:2027,interests:terms($('onboard-interests').value),career_interests:terms($('onboard-careers').value)})});$('onboarding').classList.add('hidden');openApp()}catch(err){message('onboard-message',err.message)}};
function openApp(){$('app').classList.remove('hidden');$('avatar').textContent=(state.profile.user.display_name[0]||'S').toUpperCase();navigate('home')}
async function loadJourney(){try{state.journey=await api('/journey/me')}catch{state.journey=null}}
function navigate(view){state.view=view;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===view));if(view==='home')renderHome();if(view==='explore')renderExplore();if(view==='journey')renderJourney();if(view==='wayfinder')renderWayfinder();if(view==='profile')renderProfile()}
async function renderHome(){await loadJourney();$('hero').innerHTML=`<h2>Kia ora, ${esc(state.profile.user.display_name.split(' ')[0])}</h2><p>Here’s where your journey stands.</p>`;const j=state.journey;$('content').innerHTML=`${j?`<section class="card"><div class="row"><div><span class="pill">YOUR JOURNEY</span><h3 style="margin-top:9px">${esc(j.programme.name)}</h3></div><strong style="font-size:25px">${j.progress_percent}%</strong></div><div class="progress"><span style="width:${j.progress_percent}%"></span></div><p class="muted small">${j.completed_count} of ${j.total_count} requirements complete</p></section>`:`<section class="card"><span class="pill">GET STARTED</span><h3 style="margin-top:9px">Set up your degree journey</h3><p class="muted">Choose your programme plan and see what comes next.</p><button class="btn primary" onclick="navigate('journey')">Set up journey</button></section>`}<div class="grid"><section class="card feature" onclick="navigate('explore')"><div class="icon">🎓</div><h3>Explore</h3><span class="muted small">Programmes & careers</span></section><section class="card feature" onclick="recommend()"><div class="icon">✨</div><h3>For you</h3><span class="muted small">Personalised picks</span></section><section class="card feature" onclick="navigate('wayfinder')"><div class="icon">➤</div><h3>Wayfinder</h3><span class="muted small">Find rooms & buildings</span></section><section class="card feature" onclick="navigate('profile')"><div class="icon">♡</div><h3>Saved</h3><span class="muted small">${state.profile.saved_programmes.length+state.profile.saved_careers.length} items</span></section></div><section class="card"><div class="row"><div><h3>Study matching</h3><span class="muted small">Profile foundation is ready</span></div><span class="pill">NEXT PHASE</span></div></section>`}
function exploreTabs(){return `<div class="tabs"><button class="btn ${state.explore==='programmes'?'primary':''}" onclick="setExplore('programmes')">Programmes</button><button class="btn ${state.explore==='careers'?'primary':''}" onclick="setExplore('careers')">Careers</button><button class="btn ${state.explore==='recommendations'?'primary':''}" onclick="recommend()">For you</button></div>`}
function renderExplore(items){$('hero').innerHTML='<h2>Explore</h2><p>Find a path that fits you.</p>';const source=items||(state.explore==='careers'?state.careers:state.programmes);$('content').innerHTML=`${exploreTabs()}<input id="explore-search" class="search" placeholder="Search ${state.explore}…"><div id="results" style="margin-top:14px">${cards(source)}</div>`;$('explore-search').oninput=e=>{const q=e.target.value.toLowerCase();const base=state.explore==='careers'?state.careers:state.programmes;$('results').innerHTML=cards(base.filter(x=>(x.name+' '+(x.description||'')).toLowerCase().includes(q)))}}
function cards(items){return items.slice(0,20).map(x=>`<article class="card result"><div class="row"><div><h3>${esc(x.name)}</h3>${x.faculty?`<span class="pill">${esc(x.faculty)}</span>`:''}</div><button class="btn" onclick="saveItem('${state.explore==='careers'?'career':'programme'}',${x.id},event)">♡</button></div><p class="muted small">${esc((x.description||x.duration||'View official information and connected pathways.').slice(0,145))}</p></article>`).join('')||'<div class="card muted">No results found.</div>'}
function setExplore(kind){state.explore=kind;renderExplore()}
async function recommend(){state.explore='recommendations';navigate('explore');const interests=state.profile.interests,goals=state.profile.career_interests;if(!interests.length&&!goals.length){$('results').innerHTML='<div class="card">Add interests in your profile to receive recommendations.</div>';return}try{const items=await api('/programmes/recommend/personalised',{method:'POST',body:JSON.stringify({interests,career_goals:goals,limit:8})});$('results').innerHTML=items.map(x=>`<article class="card"><div class="row"><h3>${esc(x.name)}</h3><span class="pill">${x.match_score}% match</span></div><p class="muted small">${esc(x.reason)}</p><button class="btn" onclick="saveItem('programme',${x.id},event)">Save programme</button></article>`).join('')||'<div class="card">No matches yet. Try broader interests.</div>'}catch(e){$('results').innerHTML=`<div class="card">${esc(e.message)}</div>`}}
async function saveItem(kind,id,event){event.stopPropagation();try{await api(`/profile/me/saved-${kind}s/${id}`,{method:'POST'});state.profile=await api('/profile/me');event.target.textContent='♥'}catch(e){alert(e.message)}}
async function renderJourney(){await loadJourney();$('hero').innerHTML='<h2>My Journey</h2><p>Know where you are and what comes next.</p>';if(!state.journey){$('content').innerHTML=`<section class="card"><h3>Choose your programme plan</h3><label class="field">Programme<select id="journey-programme"><option value="">Select programme</option>${state.programmes.map(p=>`<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label><label id="plan-wrap" class="field hidden">Plan<select id="journey-plan"></select></label><button id="journey-save" class="btn primary wide" disabled>Start journey</button><div id="journey-message" class="message"></div></section>`;$('journey-programme').onchange=loadPlans;$('journey-save').onclick=saveJourney;return}const j=state.journey;$('content').innerHTML=`<section class="card"><span class="pill">${esc(j.plan_name)}</span><div class="row"><h2 style="margin-top:10px">Stage ${j.current_stage}</h2><strong style="font-size:27px">${j.progress_percent}%</strong></div><div class="progress"><span style="width:${j.progress_percent}%"></span></div><p class="muted small">${j.completed_points} / ${j.total_points} points tracked</p></section><h3>Requirements</h3>${j.milestones.map(m=>`<label class="card milestone"><input type="checkbox" ${m.completed?'checked':''} onchange="toggleMilestone(${m.id},this.checked)"><span><strong>${esc(m.title)}</strong><br><span class="muted small">${esc(m.description||m.category)} · ${m.points} pts</span></span></label>`).join('')}`}
async function loadPlans(){const id=$('journey-programme').value;if(!id)return;try{const plans=await api(`/journey/programmes/${id}/plans?catalogue_year=2027`);$('plan-wrap').classList.remove('hidden');$('journey-plan').innerHTML=plans.map(p=>`<option value="${p.code}">${esc(p.name)}${p.clinical_pathway?' · Clinical pathway':''}</option>`).join('');$('journey-save').disabled=!plans.length}catch(e){message('journey-message',e.message)}}
async function saveJourney(){try{state.journey=await api('/journey/me/programme',{method:'PUT',body:JSON.stringify({programme_id:Number($('journey-programme').value),current_stage:state.profile.current_stage||1,catalogue_year:2027,plan_code:$('journey-plan').value})});renderJourney()}catch(e){message('journey-message',e.message)}}async function toggleMilestone(id,completed){try{state.journey=await api(`/journey/me/milestones/${id}`,{method:'PATCH',body:JSON.stringify({completed})});renderJourney()}catch(e){alert(e.message)}}
function renderWayfinder(){$('hero').innerHTML='<h2>Wayfinder</h2><p>Search campuses, buildings and rooms.</p>';$('content').innerHTML=`<section class="card"><input id="way-search" class="search" placeholder="Try 303, lab, lecture theatre…"><button class="btn primary wide" style="margin-top:10px" onclick="waySearch()">Search</button></section><div class="notice"><strong>Indoor AR pilot</strong><br><span class="small">The AR arrow experience is planned for the three agreed buildings once the client confirms the priority rooms and routes.</span></div><div id="way-results" style="margin-top:14px"></div><section class="card" style="margin-top:14px"><h3>Between buildings</h3><p class="muted small">The app can hand outdoor travel to Google Maps, keeping our MVP focused on indoor navigation.</p></section>`;$('way-search').onkeydown=e=>{if(e.key==='Enter')waySearch()}}
async function waySearch(){const q=$('way-search').value.trim();if(!q)return;try{const items=await api(`/wayfinding/search?q=${encodeURIComponent(q)}`);$('way-results').innerHTML=items.map(x=>`<article class="card"><div class="row"><div><h3>${esc(x.name)}</h3><span class="muted small">${esc([x.building_number,x.building_name,x.floor_label].filter(Boolean).join(' · '))}</span></div><span class="pill">${esc(x.location_type)}</span></div></article>`).join('')||'<div class="card">No locations found.</div>'}catch(e){$('way-results').innerHTML=`<div class="card">${esc(e.message)}</div>`}}
function renderProfile(){$('hero').innerHTML='<h2>My Profile</h2><p>Control your personalisation.</p>';$('content').innerHTML=`<section class="card"><label class="field">Display name<input id="profile-name" value="${esc(state.profile.user.display_name)}"></label><label class="field">Interests<input id="profile-interests" value="${esc(state.profile.interests.join(', '))}"></label><label class="field">Career interests<input id="profile-careers" value="${esc(state.profile.career_interests.join(', '))}"></label><button class="btn primary wide" onclick="saveProfile()">Save changes</button></section><section class="card"><h3>Saved items</h3><div class="chips">${[...state.profile.saved_programmes,...state.profile.saved_careers].map(x=>`<span class="chip">${esc(x.name)}</span>`).join('')||'<span class="muted small">Nothing saved yet.</span>'}</div></section><button class="btn wide" onclick="logout()">Log out</button><div id="profile-message" class="message"></div>`}
async function saveProfile(){try{state.profile=await api('/profile/me',{method:'PATCH',body:JSON.stringify({display_name:$('profile-name').value,interests:terms($('profile-interests').value),career_interests:terms($('profile-careers').value)})});$('avatar').textContent=state.profile.user.display_name[0].toUpperCase();message('profile-message','Profile saved.',true)}catch(e){message('profile-message',e.message)}}async function logout(){try{await api('/auth/logout',{method:'POST'})}catch{}sessionStorage.removeItem('journey_demo_token');location.reload()}
$('reg-tab').onclick=()=>authMode('register');$('login-tab').onclick=()=>authMode('login');$('reg-form').onsubmit=e=>{e.preventDefault();authenticate('/auth/register',e.currentTarget)};$('login-form').onsubmit=e=>{e.preventDefault();authenticate('/auth/login',e.currentTarget)};$('avatar').onclick=()=>navigate('profile');document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>navigate(n.dataset.view));if(state.token)bootstrap();
</script></body></html>
