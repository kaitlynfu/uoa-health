<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Student Profile Backend Demo</title>
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color:#17223a;background:#edf2f8}*{box-sizing:border-box}body{margin:0;padding:25px}.shell{max-width:900px;margin:auto;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 16px 45px #173e8620}header{padding:25px 28px;color:#fff;background:linear-gradient(135deg,#071c48,#2455a1)}header h1{margin:0 0 5px}header p{margin:0;opacity:.82}main{padding:24px}.account{display:flex;justify-content:space-between;align-items:center;padding:13px 15px;margin-bottom:18px;border-radius:11px;background:#edf3fb}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs button,.secondary{padding:9px 13px;border:1px solid #c9d4e5;border-radius:8px;background:#fff;cursor:pointer}.tabs .active{color:#fff;background:#173e86}.form{display:grid;gap:13px}.auth-form{max-width:450px}.two{display:grid;grid-template-columns:1fr 1fr;gap:13px}.three{display:grid;grid-template-columns:1fr 1fr 1fr;gap:13px}label{display:grid;gap:5px;font-weight:650}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;padding:10px 11px;border:1px solid #c9d4e5;border-radius:8px;background:#fff}textarea{min-height:78px;resize:vertical}.primary{padding:11px 15px;border:0;border-radius:9px;color:#fff;background:#173e86;font-weight:700;cursor:pointer}.check{display:flex;align-items:center;gap:9px}.check input{width:18px}.section{margin-top:22px;padding-top:18px;border-top:1px solid #e1e6ee}.section h2{margin:0 0 12px;font-size:19px}.save-row{display:grid;grid-template-columns:1fr auto;gap:8px}.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px}.chip{padding:7px 10px;border:1px solid #bed0ec;border-radius:18px;background:#f2f7ff;color:#173e86}.chip button{margin-left:7px;border:0;background:none;color:#a02c2c;cursor:pointer}.message{min-height:22px;margin:12px 0;color:#a02c2c}.success{color:#27643d}.hidden{display:none}.note{color:#68758c;font-size:13px}@media(max-width:650px){body{padding:0}.shell{border-radius:0}.two,.three{grid-template-columns:1fr}}
  </style>
</head>
<body><div class="shell"><header><h1>Account & Personalisation</h1><p>Live test client for the FastAPI profile backend</p></header><main>
  <section id="auth-view">
    <div class="tabs"><button id="register-tab" class="active">Create account</button><button id="login-tab">Log in</button></div>
    <form id="register-form" class="form auth-form"><label>Name<input name="display_name" required></label><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" minlength="10" required></label><button class="primary">Create account</button></form>
    <form id="login-form" class="form auth-form hidden"><label>Email<input name="email" type="email" required></label><label>Password<input name="password" type="password" required></label><button class="primary">Log in</button></form>
  </section>
  <section id="profile-view" class="hidden">
    <div class="account"><div><strong id="account-name"></strong><br><span id="account-email" class="note"></span></div><button id="logout" class="secondary">Log out</button></div>
    <form id="profile-form" class="form">
      <div class="two"><label>Display name<input id="display-name"></label><label>Programme<select id="programme"></select></label></div>
      <div class="two"><label>Current stage/year<input id="stage" type="number" min="1" max="10"></label><label>Catalogue year<input id="catalogue-year" type="number" min="2024" max="2100"></label></div>
      <label>About me<textarea id="bio" placeholder="A short introduction"></textarea></label>
      <div class="three"><label>Interests<input id="interests" placeholder="Health, technology"></label><label>Hobbies<input id="hobbies" placeholder="Football, music"></label><label>Career interests<input id="career-interests" placeholder="Medicine, research"></label></div>
      <label>Current courses<input id="courses" placeholder="BIOSCI 107, CHEM 190"></label>
      <div class="three"><label>Study mode<select id="study-mode"><option value="">Not set</option><option value="in_person">In person</option><option value="online">Online</option><option value="hybrid">Hybrid</option></select></label><label>Study style<input id="study-style" placeholder="Structured sessions"></label><label>Preferred group size<input id="group-size" type="number" min="1" max="20"></label></div>
      <label>Availability<input id="availability" placeholder="Weekday afternoons"></label>
      <label class="check"><input id="matching-enabled" type="checkbox">Allow my profile to appear in future peer matching</label>
      <button class="primary">Save profile</button>
    </form>
    <div class="section"><h2>Saved programmes</h2><div class="save-row"><select id="programme-save"></select><button id="save-programme" class="primary">Save</button></div><div id="saved-programmes" class="chips"></div></div>
    <div class="section"><h2>Saved careers</h2><div class="save-row"><select id="career-save"></select><button id="save-career" class="primary">Save</button></div><div id="saved-careers" class="chips"></div></div>
  </section>
  <div id="message" class="message"></div><p class="note">This isolated page uses the real local backend. Matching remains opt-in and profile data is private to the signed-in account.</p>
</main></div>
<script>
  const state={token:sessionStorage.getItem('journey_demo_token'),programmes:[],careers:[],profile:null};const $=id=>document.getElementById(id);
  async function api(path,options={}){const headers={'Content-Type':'application/json',...(options.headers||{})};if(state.token)headers.Authorization=`Bearer ${state.token}`;const response=await fetch(path,{...options,headers});const data=response.status===204?null:await response.json();if(!response.ok)throw new Error(data?.detail||`Request failed (${response.status})`);return data}
  function terms(id){return $(id).value.split(',').map(x=>x.trim()).filter(Boolean)}
  function authMode(mode){$('register-form').classList.toggle('hidden',mode!=='register');$('login-form').classList.toggle('hidden',mode==='register');$('register-tab').classList.toggle('active',mode==='register');$('login-tab').classList.toggle('active',mode==='login')}
  async function authenticate(path,form){try{const payload=Object.fromEntries(new FormData(form));const data=await api(path,{method:'POST',body:JSON.stringify(payload)});state.token=data.access_token;sessionStorage.setItem('journey_demo_token',state.token);await showProfile()}catch(error){showMessage(error.message)}}
  async function showProfile(){try{state.programmes=await api('/programmes');state.careers=await api('/careers');state.profile=await api('/profile/me');$('auth-view').classList.add('hidden');$('profile-view').classList.remove('hidden');render()}catch(error){state.token=null;sessionStorage.removeItem('journey_demo_token');$('auth-view').classList.remove('hidden');$('profile-view').classList.add('hidden');showMessage(error.message)}}
  function render(){const p=state.profile;$('account-name').textContent=p.user.display_name;$('account-email').textContent=p.user.email;$('display-name').value=p.user.display_name;$('programme').innerHTML='<option value="">Not selected</option>'+state.programmes.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('programme').value=p.programme?.id||'';$('stage').value=p.current_stage||'';$('catalogue-year').value=p.catalogue_year||2027;$('bio').value=p.bio||'';$('interests').value=p.interests.join(', ');$('hobbies').value=p.hobbies.join(', ');$('career-interests').value=p.career_interests.join(', ');$('courses').value=p.courses.map(x=>x.course_code).join(', ');$('study-mode').value=p.study_preferences.study_mode||'';$('study-style').value=p.study_preferences.study_style||'';$('group-size').value=p.study_preferences.preferred_group_size||'';$('availability').value=p.study_preferences.availability||'';$('matching-enabled').checked=p.matching_enabled;$('programme-save').innerHTML=state.programmes.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('career-save').innerHTML=state.careers.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');$('saved-programmes').innerHTML=p.saved_programmes.map(x=>`<span class="chip">${x.name}<button data-id="${x.id}" data-kind="programme">×</button></span>`).join('')||'<span class="note">Nothing saved yet.</span>';$('saved-careers').innerHTML=p.saved_careers.map(x=>`<span class="chip">${x.name}<button data-id="${x.id}" data-kind="career">×</button></span>`).join('')||'<span class="note">Nothing saved yet.</span>';document.querySelectorAll('.chip button').forEach(button=>button.onclick=()=>removeSaved(button.dataset.kind,button.dataset.id))}
  async function saveProfile(event){event.preventDefault();const programmeId=Number($('programme').value)||null;const payload={display_name:$('display-name').value,programme_id:programmeId,current_stage:Number($('stage').value)||null,catalogue_year:Number($('catalogue-year').value)||null,bio:$('bio').value||null,interests:terms('interests'),hobbies:terms('hobbies'),career_interests:terms('career-interests'),courses:terms('courses').map(course_code=>({course_code,academic_year:Number($('catalogue-year').value)||null})),study_preferences:{study_mode:$('study-mode').value||null,study_style:$('study-style').value||null,preferred_group_size:Number($('group-size').value)||null,availability:$('availability').value||null},matching_enabled:$('matching-enabled').checked};try{state.profile=await api('/profile/me',{method:'PATCH',body:JSON.stringify(payload)});render();showMessage('Profile saved.','success')}catch(error){showMessage(error.message)}}
  async function addSaved(kind){try{const id=$(kind==='programme'?'programme-save':'career-save').value;await api(`/profile/me/saved-${kind}s/${id}`,{method:'POST'});state.profile=await api('/profile/me');render();showMessage(`${kind[0].toUpperCase()+kind.slice(1)} saved.`,'success')}catch(error){showMessage(error.message)}}
  async function removeSaved(kind,id){try{await api(`/profile/me/saved-${kind}s/${id}`,{method:'DELETE'});state.profile=await api('/profile/me');render()}catch(error){showMessage(error.message)}}
  function showMessage(text,type=''){const message=$('message');message.textContent=text;message.className=`message ${type}`}
  $('register-tab').onclick=()=>authMode('register');$('login-tab').onclick=()=>authMode('login');$('register-form').onsubmit=e=>{e.preventDefault();authenticate('/auth/register',e.currentTarget)};$('login-form').onsubmit=e=>{e.preventDefault();authenticate('/auth/login',e.currentTarget)};$('profile-form').onsubmit=saveProfile;$('save-programme').onclick=()=>addSaved('programme');$('save-career').onclick=()=>addSaved('career');$('logout').onclick=async()=>{try{await api('/auth/logout',{method:'POST'})}catch{}state.token=null;sessionStorage.removeItem('journey_demo_token');location.reload()};if(state.token)showProfile();
</script></body></html>
