name: PostgreSQL compatibility
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: team43
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: team43_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U team43 -d team43_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+psycopg://team43:ci-only-password@localhost:5432/team43_test
      TEST_DATABASE_URL: postgresql+psycopg://team43:ci-only-password@localhost:5432/team43_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify migration matches models
        run: |
          python -m alembic upgrade head
          python -m alembic check
          python -m alembic downgrade base
          python -m alembic upgrade head
      - name: Exercise API against PostgreSQL
        run: python -m pytest -q
