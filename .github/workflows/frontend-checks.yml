name: Frontend pull request checks
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: frontend-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test:dependencies
      - run: npx tsc --noEmit
      - run: npm run test:screens && npm run test:student && npm run test:wayfinding
