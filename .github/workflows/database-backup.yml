name: Database backup

on:
  pull_request:
    branches: [main]
    # Required checks must also run for frontend-only and documentation PRs.
  workflow_dispatch:
  schedule:
    # 14:23 UTC = 02:23 NZST / 03:23 NZDT the next day. Best-effort scheduling.
    - cron: '23 14 * * *'

permissions:
  contents: read

jobs:
  test:
    name: Backup tooling tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    if: github.event_name != 'schedule' || vars.TEAM43_BACKUPS_ENABLED == 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r deployment/backup-requirements.txt
      - run: python -m unittest discover -s deployment -p 'test_*.py' -v

  backup:
    name: Back up database to S3
    needs: test
    if: >-
      github.repository == 'uoa-compsci399-s2-2026-jun/team-43-project' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' ||
       (github.event_name == 'schedule' && vars.TEAM43_BACKUPS_ENABLED == 'true'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: team43-backend-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    # No GitHub environment: the IAM trust expects the main-branch subject.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: python -m pip install -r deployment/backup-requirements.txt
      - name: Authenticate with the backup-only role
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: arn:aws:iam::467506935568:role/team43-github-backup
          aws-region: ap-southeast-2
          allowed-account-ids: '467506935568'
          role-session-name: team43-backup-${{ github.run_id }}
          role-duration-seconds: 1800
      - name: Create and upload a validated snapshot
        env:
          TEAM43_BACKUPS_ENABLED: ${{ vars.TEAM43_BACKUPS_ENABLED }}
          TEAM43_DATABASE_ENGINE: ${{ vars.TEAM43_DATABASE_ENGINE }}
          AWS_EC2_METADATA_DISABLED: 'true'
          AWS_PAGER: ''
        run: python deployment/dispatch_backup.py
      - name: Failure guidance
        if: failure()
        run: echo '::error::Backup not confirmed. Inspect the failed step and any recorded SSM command in AWS. Check S3 before retrying; an upload may have completed. The live database was not replaced.'
